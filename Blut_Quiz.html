<!DOCTYPE html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blut-Mission</title><style>*{box-sizing:border-box}body{font:20px system-ui,sans-serif;background:#edf4fa;color:#17334a;margin:0}main{max-width:760px;margin:24px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 8px 30px #17334a18}h1{margin:0;color:#a92338}small{font-size:16px}progress{width:100%;height:18px;accent-color:#167c80}button{font:inherit;cursor:pointer;border:2px solid #b7cbd8;border-radius:16px;background:white;color:inherit;padding:14px;text-align:left}button:focus-visible{outline:4px solid #e7a92e}#options{display:grid;gap:10px}#options button{display:flex;align-items:center;gap:16px}svg{width:84px;height:68px;flex-shrink:0}#picture svg{width:160px;height:120px}#picture{text-align:center}#feedback{min-height:60px;padding:12px;border-radius:12px} .yes{background:#d9f4e4;color:#125c36}.no{background:#ffeadc;color:#8c3518}#next,#restart{background:#176b83;color:white;border:0;text-align:center;width:100%}button:disabled{cursor:default;opacity:.85}#score{font-weight:bold}header{display:flex;justify-content:space-between;align-items:center;gap:8px} @media(max-width:500px){main{margin:8px;padding:16px}body{font-size:18px}}</style><main><header><h1>🩸 Blut-Mission</h1><small id="score"></small></header><p>Teste dein Wissen über das Blut!</p><progress id="progress" max="5" value="0"></progress><p id="step"></p><div id="picture"></div><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden>Weiter →</button><button id="restart" hidden>↻ Noch einmal spielen</button></main><script>
const wrap=s=>`<svg viewBox="0 0 120 90" aria-hidden="true">${s}</svg>`;
const art={red:wrap('<ellipse cx="60" cy="48" rx="48" ry="30" fill="#a91e30"/><ellipse cx="60" cy="40" rx="47" ry="25" fill="#ef4149" stroke="#a91e30" stroke-width="3"/><ellipse cx="60" cy="40" rx="24" ry="12" fill="#b31d30"/><path d="M24 33 Q48 14 85 26" fill="none" stroke="#ffaaaa" stroke-width="5" stroke-linecap="round"/>'),white:wrap('<circle cx="60" cy="45" r="37" fill="#e9e5f5" stroke="#8277a8" stroke-width="3"/><path d="M39 25 Q20 48 44 56 Q49 78 70 60 Q98 49 78 29 Q65 15 58 36 Q50 15 39 25" fill="#8870b4"/>'),plate:wrap([ [30,25],[82,27],[57,65]].map(([x,y])=>`<path transform="translate(${x} ${y})" d="M-15 -4 L-6 -7 L-4 -16 L4 -8 L15 -12 L10 0 L17 8 L4 9 L-3 17 L-8 7 L-17 6Z" fill="#a87bc9" stroke="#704590" stroke-width="2"/>`).join('')),plasma:wrap('<path d="M60 5 C48 25 24 49 24 60 A36 25 0 0 0 96 60 C96 49 72 25 60 5Z" fill="#f4d36c" stroke="#b58b27" stroke-width="3"/><path d="M48 33 Q30 53 37 65" fill="none" stroke="#fff4bd" stroke-width="6" stroke-linecap="round"/>'),oxygen:wrap('<circle cx="60" cy="45" r="38" fill="#bceaff" stroke="#267ca9" stroke-width="3"/><text x="60" y="57" text-anchor="middle" font-size="36" font-weight="bold" fill="#14567e">O₂</text>'),germ:wrap('<g stroke="#438149" stroke-width="5">'+Array.from({length:12},(_,i)=>`<path transform="rotate(${i*30} 60 45)" d="M60 12 V3"/>`).join('')+'</g><circle cx="60" cy="45" r="32" fill="#83c86b" stroke="#438149" stroke-width="3"/><circle cx="48" cy="38" r="5"/><circle cx="72" cy="38" r="5"/><path d="M47 62 Q60 48 73 62" fill="none" stroke="#345b32" stroke-width="3"/>'),wound:wrap('<rect x="8" y="22" width="104" height="48" rx="24" fill="#efb48a"/><path d="M49 23 L65 42 L51 52 L68 70" stroke="#bd2439" stroke-width="7" fill="none"/>'),blue:wrap('<circle cx="60" cy="45" r="30" fill="#327bc3"/>'),yellow:wrap('<circle cx="60" cy="45" r="30" fill="#f4d36c" stroke="#b58b27"/>'),colorred:wrap('<circle cx="60" cy="45" r="30" fill="#d73540"/>')};
const names={red:'Rote Blutkörperchen',white:'Weiße Blutkörperchen',plate:'Blutplättchen',plasma:'Blutplasma',oxygen:'Sauerstoff',blue:'Blau',yellow:'Gelblich',colorred:'Rot'};
const questions=[['Wer transportiert Sauerstoff?','oxygen',['plate','red','white'],'red','Rote Blutkörperchen bringen Sauerstoff zu den Körperzellen.'],['Wer bekämpft Krankheitserreger?','germ',['white','plasma','red'],'white','Weiße Blutkörperchen schützen unseren Körper vor Krankheitserregern.'],['Wer hilft, eine Wunde zu verschließen?','wound',['plasma','red','plate'],'plate','Blutplättchen helfen bei der Blutgerinnung.'],['Wie heißt der flüssige Teil des Blutes?',null,['plasma','oxygen','plate'],'plasma','Blutplasma ist die Flüssigkeit, in der die Blutbestandteile schwimmen.'],['Welche Farbe hat das Blutplasma normalerweise?',null,['blue','colorred','yellow'],'yellow','Blutplasma ist normalerweise gelblich.']];
let i=0,points=0,tried=false,done=false;const $=id=>document.getElementById(id);function show(){tried=false;done=false;let [q,p,opts]=questions[i];$('step').textContent=`Frage ${i+1} von ${questions.length}`;$('progress').value=i;$('score').textContent=`⭐ ${points} Punkte`;$('question').textContent=q;$('picture').innerHTML=p?art[p]:'';$('feedback').textContent='';$('feedback').className='';$('next').hidden=true;$('restart').hidden=true;$('options').replaceChildren();opts.forEach(k=>{let b=document.createElement('button');b.innerHTML=art[k]+`<span>${names[k]}</span>`;b.onclick=()=>answer(k,b);$('options').append(b)})}function answer(k,b){if(done)return;let q=questions[i];if(k===q[3]){done=true;if(!tried)points++;$('feedback').className='yes';$('feedback').textContent='✓ Richtig! '+q[4];b.className='yes';document.querySelectorAll('#options button').forEach(x=>x.disabled=true);$('score').textContent=`⭐ ${points} Punkte`;$('progress').value=i+1;$('next').hidden=false;$('next').textContent=i===4?'Ergebnis ansehen →':'Weiter →';$('next').focus()}else{tried=true;b.disabled=true;b.className='no';$('feedback').className='no';$('feedback').textContent='Noch nicht richtig. Versuche es noch einmal!';let n=[...$('options').children].find(x=>!x.disabled);if(n)n.focus()}}$('next').onclick=()=>{if(!done)return;i++;if(i<questions.length)show();else{$('step').textContent='Mission abgeschlossen!';$('question').textContent='🎉 Geschafft!';$('picture').innerHTML=art.red+art.white+art.plate+art.plasma;$('options').replaceChildren();$('feedback').className='yes';$('feedback').textContent=`Du hast alle 5 Fragen gelöst. ${points} von 5 waren beim ersten Versuch richtig.`;$('next').hidden=true;$('restart').hidden=false;$('restart').focus()}};$('restart').onclick=()=>{i=0;points=0;show()};show();</script></html>
